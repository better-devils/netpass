str_update_patches: Nuashonraigh paistí
str_update_patches_desc: Chun NetPass a shuiteáil i gceart, cruthófar roinnt 
  paistí "sysmodule" anois. Beidh ort "Enable loading external FIRMs and 
  modules" sna socruithe Luma3DS a chumasú, ionas go mbeidh na paistí seo ag 
  obair. Chun na socruithe seo a fháil, múch an consól, agus ansin, brúigh 
  {select_button}, agus an consól á chur ar siúl {power_button}. Is féidir leat 
  é seo a dhéanamh tar éis scríobh na bpaistí.
str_update_patches_error_desc: Tharla earráid nuair a bhí na paistí á nuashonrú.
  Tuairiscigh an fhadhb seo ar GitLab, GBAtemp nó Discord, le do thoil. 
  https://netpass.cafe/discord
