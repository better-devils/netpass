str_update_patches: Aggiorna patch
str_update_patches_desc: Per installare correttamente NetPass verranno create 
  delle patch. Per farle funzionare, assicurati di aver abilitato "Enable 
  loading external FIRMs and modules" nelle impostazioni di Luma3DS. Per aprire 
  le impostazioni, spegni la console e tieni premuto {select_button} mentre 
  accendi {power_button} la console. Puoi farlo anche dopo aver installato le 
  patch.
str_update_patches_error_desc: Si è verificato un errore nell'aggiornamento 
  delle patch. Segnala questo errore su GitLab, GBATemp o Discord. 
  https://netpass.cafe/discord
