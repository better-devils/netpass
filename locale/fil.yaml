str_update_patches: I-update ang mga patch
str_update_patches_desc: Upang maayos na ma-install ang NetPass, gagawa ngayon 
  ng ilang sysmodule patch. Para gumana ang mga ito, kailangan mong i-enable ang
  "Enable loading external FIRMs and modules" sa mga setting ng Luma3DS. Para 
  ma-access ang mga setting, patayin ang console at pagkatapos ay pindutin ang 
  {select_button} habang pinapagana {power_button} ang console. Maaari mo itong 
  gawin matapos maisulat ang mga patch.
str_update_patches_error_desc: May nagkamali habang ina-update ang mga patch. 
  Mangyaring i-report ang isyung ito sa GitLab, GBAtemp o Discord. 
  https://netpass.cafe/discord
str_update_patches_poweroff_desc: Matagumpay ang pag-update ng mga patch! 
  Magre-restart na ngayon ang iyong console.
